name: Build iOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests in an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          RADAR_DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[v["udid"] for k,vs in d["devices"].items() if ".iOS-" in k for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")]; print(ids[0] if ids else "")')"
          if [ -z "$RADAR_DEVICE_ID" ]; then
            echo "No available iPhone simulator on this runner"
            exit 1
          fi
          xcodebuild test \
            -project LocalNetworkRadar.xcodeproj \
            -scheme LocalNetworkRadar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$RADAR_DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/RadarTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive an unsigned device app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project LocalNetworkRadar.xcodeproj \
            -scheme LocalNetworkRadar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LocalNetworkRadar.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/RadarIPA/Payload"
          ditto "$RUNNER_TEMP/LocalNetworkRadar.xcarchive/Products/Applications/LocalNetworkRadar.app" \
            "$RUNNER_TEMP/RadarIPA/Payload/LocalNetworkRadar.app"
          cd "$RUNNER_TEMP/RadarIPA"
          zip -qry "$GITHUB_WORKSPACE/LocalNetworkRadar-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalNetworkRadar-unsigned-IPA
          path: LocalNetworkRadar-unsigned.ipa
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RadarTests-results
          path: ${{ runner.temp }}/RadarTests.xcresult
          if-no-files-found: ignore

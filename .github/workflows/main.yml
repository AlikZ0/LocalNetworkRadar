# Save this file as .github/workflows/main.yml at the repository root.
# Commit the extracted Xcode project and source files, not only their ZIP.
name: Build Local Network Radar IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30

    env:
      RADAR_SCHEME: LocalNetworkRadar

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare logs and show Xcode
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          xcodebuild -version | tee "$GITHUB_WORKSPACE/artifacts/logs/xcode-version.log"

      - name: Find and validate Xcode project
        id: project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          excluded = {".git", "Pods", "Carthage", ".build", "DerivedData", "artifacts"}
          projects = sorted(
              path for path in root.rglob("LocalNetworkRadar.xcodeproj")
              if path.is_dir() and not excluded.intersection(path.relative_to(root).parts)
          )
          if not projects:
              print("::error::LocalNetworkRadar.xcodeproj was not found. Commit the extracted project and Swift sources; a ZIP file alone cannot be built.")
              sys.exit(1)
          if len(projects) != 1:
              print("::error::Multiple LocalNetworkRadar.xcodeproj directories were found. Keep one buildable copy in the repository.")
              for path in projects:
                  print(path.relative_to(root))
              sys.exit(1)

          project = projects[0]
          if any(char in str(project) for char in ("\n", "\r")):
              print("::error::Project paths containing newlines are not supported.")
              sys.exit(1)
          if not (project / "project.pbxproj").is_file():
              print("::error::The Xcode project is incomplete: project.pbxproj is missing.")
              sys.exit(1)
          scheme = project / "xcshareddata" / "xcschemes" / (os.environ["RADAR_SCHEME"] + ".xcscheme")
          if not scheme.is_file():
              print("::error::The shared LocalNetworkRadar scheme is missing. Include the .xcodeproj/xcshareddata/xcschemes directory from the source archive.")
              sys.exit(1)

          print("Project:", project.relative_to(root))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("path=" + str(project) + "\n")
          PY

      # Archive for a physical iPhone. No simulator or Apple ID is required.
      - name: Build unsigned device archive
        env:
          RADAR_PROJECT: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$RADAR_PROJECT" \
            -scheme "$RADAR_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LocalNetworkRadarDerivedData" \
            -archivePath "$RUNNER_TEMP/LocalNetworkRadar.xcarchive" \
